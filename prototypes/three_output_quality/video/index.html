<h1>迴圈邊界：四支試片，直接比較</h1>
<p>同一份保存旁白。A 與 B 為完整 69.66 秒影片；白板與文字候選使用相同開場的前兩句。這是固定教材與編排的比較樣片，尚未代表 AI 自動選擇或使用者品質驗收。</p>
<div class="tabs"><button data-src="out/A-original.mp4" aria-pressed="false">A · 保存基準</button><button data-src="out/B-board.mp4" aria-pressed="true">B · 狀態＋結果＋判斷流程</button><button data-src="out/C-y3_whiteboard.mp4" aria-pressed="false">候選 · 白板推導</button><button data-src="out/C-y5_kinetic_type.mp4" aria-pressed="false">候選 · 文字揭示</button></div>

<div class="tabs"><button data-time="2">片頭</button><button data-time="14.37">第一次換場</button><button data-time="26.5">程式／變數／結果</button><button data-time="29.98">第二次換場</button><button data-time="43">陣列邊界</button><button data-time="67.3">片尾</button></div>
<aside id="note">B：同配音的 renderer 固定 fixture。句界來自保存音檔，動作採句界；沒有詞級對齊承諾。</aside>

document.querySelectorAll('[data-src]').forEach(button=>button.onclick=()=>{player.pause();player.src=button.dataset.src;document.querySelectorAll('[data-src]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.getElementById('note').textContent=button.dataset.src.includes('/C-')?'外部候選：13.458 秒、保存開場音檔；固定版本花叔元件，本機繁體字體。':'同講稿／配音的比較樣片。B 另加計算結果與判斷流程，屬編排改善對照，並非只有換色。';});
document.querySelectorAll('[data-time]').forEach(button=>button.onclick=()=>{const t=+button.dataset.time;player.currentTime=Math.min(t,Math.max(0,(player.duration||70)-.1));});
