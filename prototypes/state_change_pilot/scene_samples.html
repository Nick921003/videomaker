document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
document.getElementById("tabs").addEventListener("keydown",e=>{if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;e.preventDefault();const buttons=[...document.querySelectorAll("[data-mode]")],i=buttons.findIndex(b=>b.dataset.mode===mode),next=buttons[(i+(e.key==="ArrowRight"?1:2))%3];setMode(next.dataset.mode);next.focus()});
document.getElementById("play").addEventListener("click",()=>setPlaying(!playing));seek.addEventListener("input",()=>{time=Number(seek.value);render(time)});document.getElementById("speed").addEventListener("change",e=>speed=Number(e.target.value));
document.querySelectorAll("[data-time]").forEach(b=>b.addEventListener("click",()=>{time=Number(b.dataset.time);render(time)}));
document.addEventListener("keydown",e=>{if(e.code==="Space"&&!e.target.matches("input,select,button")){e.preventDefault();setPlaying(!playing)}});
window.render=render;window.stateAt=stateAt;window.setMode=setMode;window.setPreviewTime=(t)=>{setPlaying(false);time=clamp(t,0,44);return render(time)};
const query=new URLSearchParams(location.hash.slice(1));if(query.get("mode"))mode=query.get("mode");if(query.has("t")){time=Number(query.get("t"));playing=false}
document.getElementById("usage-note").textContent=`這次新增分鏡：${DATA.tokens.current_run_new_tokens.toLocaleString()} tokens；本支所用來源整理、口語稿與分鏡合計：${DATA.tokens.attributed_single_preview_tokens.toLocaleString()} tokens（含重用素材）；所有試驗累計：${DATA.tokens.experiment_total_tokens.toLocaleString()} tokens。`;
setPlaying(playing);setMode(mode);function tick(now){if(last&&playing){time=(time+Math.min(.1,(now-last)/1000)*speed)%44;render(time)}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script>
</body>
</html>
