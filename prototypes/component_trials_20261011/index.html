<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>程式教材 · 動畫元件試片</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#efece5;color:#253432;font:16px/1.6 "Noto Sans CJK TC",system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:30px}header{display:flex;justify-content:space-between;gap:24px;align-items:baseline}h1{font-size:26px;margin:0;letter-spacing:-.04em}header p{margin:0;color:#697570}button,a,select{font:inherit}button,select{border:1px solid #bec8c1;border-radius:8px;padding:9px 15px;background:#fffdf7;color:#253432;cursor:pointer}button:hover{border-color:#357260}button:focus-visible,a:focus-visible{outline:3px solid #267c67;outline-offset:3px}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:25px 0 20px}.card{text-align:left;padding:14px;min-height:98px;border:1px solid #c5cfc8;background:#faf8f2}.card[aria-pressed=true]{background:#244f43;color:#fff;border-color:#244f43}.card small{display:block;opacity:.75;font-size:12px;margin-bottom:6px}.card strong{font-size:18px;display:block}.card .choice{font-size:12px;margin-top:5px;display:block}.player{background:#121a17;aspect-ratio:16/9;width:100%;position:relative;border-radius:12px;overflow:hidden}iframe,video{width:100%;height:100%;border:0;display:block}.controls{display:flex;align-items:center;gap:12px;padding:14px 0}.controls input{flex:1;min-width:60px;accent-color:#244f43}.controls output{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:20px 0;border-top:1px solid #cbd0c7}h2{margin:0;font-size:22px}p{margin:9px 0}.muted{color:#66756c}.evaluation{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.evaluation button[aria-pressed=true]{background:#244f43;color:white}.download{display:flex;flex-wrap:wrap;gap:20px;margin-top:16px}a{color:#245e4b}.timeline{display:flex;gap:3px;width:100%;padding-top:12px}.beat{background:#d8dfd6;padding:9px 8px;border-radius:4px;font-size:12px;overflow:hidden}.source{font-size:13px;margin-top:14px}.scope{font-size:13px;margin-top:16px;color:#66756c}.mode{display:flex;gap:8px}.mode button{font-size:13px;padding:5px 10px}.mode button[aria-pressed=true]{background:#dde7df}#state{min-height:24px;font-size:13px;color:#66756c}
.poster{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:#121a17;border-radius:0}.poster img{width:100%;height:100%;object-fit:contain}.poster span{position:absolute;bottom:23%;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:28px;background:rgba(20,40,32,.92);color:white;font-size:16px;white-space:nowrap;box-shadow:0 2px 16px #0004}
@media(max-width:1000px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){main{padding:16px}header{display:block}header p{margin-top:8px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:18px}.card{min-height:90px}.detail{grid-template-columns:1fr;gap:8px}.controls{flex-wrap:wrap}.controls input{flex-basis:40%}.beat{font-size:11px;padding:8px 3px}h1{font-size:23px}.player{border-radius:7px}}
</style></head>
<body><main>
<header><h1>程式教材 · 動畫元件試片</h1><p>6 個候選 · 每支 15 秒 · 動畫＋字幕</p></header>
<nav class="cards" id="cards" aria-label="選擇候選元件"></nav>
<div class="player" id="player"></div>
<div class="controls"><button id="play" disabled>播放</button><button id="restart" disabled>重播</button><input id="seek" type="range" min="0" max="15" step="0.0416667" value="0" aria-label="試片時間" disabled><output id="time">0.0 / 15.0 秒</output><div class="mode"><button id="animation" aria-pressed="true">動畫預覽</button><button id="mp4" aria-pressed="false">MP4 成片</button></div></div>
<div id="state" role="status"></div>
<div class="detail"><section><h2 id="title"></h2><p id="effect"></p><p class="muted" id="use"></p><div class="source" id="source"></div><div class="download"><a id="download" download>下載 MP4</a><a id="subtitles" download>下載字幕</a><button id="export-choices">匯出評選紀錄</button></div></section><section><p>這個元件適合納入嗎？</p><div class="evaluation" id="evaluation"><button data-choice="保留">保留</button><button data-choice="待調整">待調整</button><button data-choice="淘汰">淘汰</button><button data-choice="">清除評選</button></div><p class="muted" id="saved"></p><div class="timeline" id="timeline"></div><p class="scope">這批是手工編排的教材試片。評選先保存在此瀏覽器，尚未加入正式元件庫。文字與手帳沿用已確認的選擇。</p></section></div>
</main><script src="review.js"></script></body></html>
