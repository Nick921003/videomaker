<!DOCTYPE html>

  <head>
    <meta charset="UTF-8">

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="lib/kit/kit.css">
    <style>
      /* fonts:begin */
@font-face { font-family: "LXGW WenKai TC"; src: url("assets/fonts/lxgw-wenkai-tc.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
@font-face { font-family: "Huninn"; src: url("assets/fonts/huninn.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
@font-face { font-family: "Patrick Hand"; src: url("assets/fonts/patrick-hand.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
@font-face { font-family: "Long Cang"; src: url("assets/fonts/long-cang.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
@font-face { font-family: "ZCOOL KuaiLe"; src: url("assets/fonts/zcool-kuaile.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }

/* fonts:end */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #141c18; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #141c18; }
      /* draft stories (story.draft: silent narration with estimated times) */
      .v8-draft {
        position: absolute; right: 64px; top: 40px; padding: 6px 18px 8px; border: 3px dashed var(--kit-warn); border-radius: 10px;
        background: rgba(20, 30, 25, 0.86); color: var(--kit-warn); font-family: var(--kit-font-display); font-size: 30px; letter-spacing: 0.04em;
      }
    </style>
  <style id="tc-fonts">
/* 繁體：原 kit 的龍藏體、站酷快樂體只涵蓋簡體，繁體字會混入系統字型 */
:root {
  --kit-font-display: "Huninn", "LXGW WenKai TC", cursive;
  --kit-font-body: "LXGW WenKai TC", "Huninn", cursive;
  --kit-font-hand: "LXGW WenKai TC", cursive;
  --kit-font-mono: "Patrick Hand", "LXGW WenKai TC", cursive;
}

</head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="235.85" data-width="1920" data-height="1080" data-stamp="story">
      <div id="stage" class="clip" data-start="0" data-duration="235.85" data-track-index="1" data-layout-allow-overflow="" data-stamp="story"></div>
      <audio id="narration" src="assets/audio/narration.wav" data-start="0" data-duration="235.85" data-track-index="10" data-stamp="narration"></audio>
      <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="235.85" data-track-index="11" data-stamp="story"></audio>
    </div>

    <script src="lib/core.js"></script>
    <script src="lib/story.js"></script>
    <script src="lib/kit/kit.js"></script>
    <script src="beats.js"></script>
    <script>
      /* V8 黑板报 starter driver — the film minus the topic. Everything below comes from window.STORY:
       *   the board (one panel per chapter, pages = ⌈lines / 2⌉, walked as a ring: top row → right, bottom row ← left,
       *   then up to the 报头 masthead top-left), the chalk headlines (= the captions, Kit.say at the spoken times),
       *   the chapter badges (Kit.chapter), the closing line in the masthead (Kit.title), the one-frame mind map on the
       *   clean side of the board (Kit.recap) and the camera. beats.js performs each line inside its slot (api below);
       *   the starter's beats.js puts an on-style storyboard placeholder there. See STARTER.md. */
      (function () {
        "use strict";
        var C = window.ExplainerCore, K = window.Kit, G = K.geo, S = K.S, T = K.T, seq = K.seq, wlen = K.wlen;
        var story = new C.Story(window.STORY), D = story.data, DUR = story.duration;
        // 先畫後講（使用者 2026-10-25）：f5_story 的 leads.json 在開口前留 lead 秒給 beats 畫圖，鏡頭要在 start − lead 就到；
        // holds.json 的 hold 是講完後多停，換頁要等 end ＋ hold 才出發
        function drawAt(l) { var L = story.line(l); return L.start - (L.lead || 0); }
        function doneAt(l) { var L = story.line(l); return L.end + (L.hold || 0); }
        if (!story.chapters.length) story.chapters = [{ n: 1, key: "all", title: story.title || "", start: 0, end: DUR }];
        var CH = story.chapters;
        var END = story.end && story.end.line ? story.end.line : null;
        var REC = story.recap && (story.recap.points || []).length && story.recap.start < DUR - 1 ? story.recap : null;
        var PW = 1840, PH = 1020, GAP = 60, PAD = 48;
        var BORDERS = K.BORDERS || ["wave", "dash", "scallop", "dot", "zig", "double", "wave"];
        var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };

        // ---------------- lines → chapters ----------------
        var LINES = story.lines.filter(function (L) { return L.i !== END; });
        var chapOf = {};
        LINES.forEach(function (L) {
          var k = -1;
          CH.forEach(function (c, j) { if (k < 0 && L.start >= c.start - 0.05 && L.start < c.end) k = j; });
          if (k < 0) CH.forEach(function (c, j) { if (c.start <= L.start + 0.3) k = j; });
          chapOf[L.i] = Math.max(0, k);
        });
        var chLines = CH.map(function (c, k) { return LINES.filter(function (L) { return chapOf[L.i] === k; }).map(function (L) { return L.i; }); });
        // story.pages（f5_story.py 寫入）指定每頁放哪幾句；沒有就每章 ⌈句數 / 2⌉ 頁
        // story.screens：改在電腦畫面上演的句子，整段算一頁（不寫粉筆標題，見 SCREENS）
        var GROUPS = D.pages ? D.pages.map(function (g) { return { lines: g }; }).concat((D.screens || []).map(function (sc, k) { return { lines: sc.lines, screen: k }; })) : null;
        var FIXED = GROUPS ? chLines.map(function (ls) { return GROUPS.filter(function (g) { return ls.indexOf(g.lines[0]) >= 0; }).sort(function (a, b) { return ls.indexOf(a.lines[0]) - ls.indexOf(b.lines[0]); }); }) : null;
        var pagesOf = FIXED ? FIXED.map(function (g) { return Math.max(1, g.length); }) : chLines.map(function (ls) { return Math.max(1, Math.min(3, Math.ceil(ls.length / 2))); });

        // ---------------- the board: one row — [review][masthead][chalk][screens…] ----------------
        // 粉筆頁全疊在同一格、換頁用板擦擦掉；電腦畫面各占一格排右邊，報頭、複習頁排左邊。
        // 使用者 2026-10-25：鏡頭一直往右甩又晃，手帳版直線滑過去比較順
        var NSCR = (D.screens || []).length;
        var COL_CHALK = (REC ? 1 : 0) + (END ? 1 : 0), COL_SCREEN = COL_CHALK + 1;
        var LAY = { rows: 1, cols: COL_SCREEN + NSCR, lessonCols: 1 + NSCR,
          mast: END ? { col: COL_CHALK - 1, row: 0 } : null, recap: REC ? { col: 0, row: 0 } : null };

        var stage = document.getElementById("stage");
        var B = K.board({ stage: stage, cols: LAY.cols, rows: LAY.rows, panelW: PW, panelH: PH, gap: GAP });

        // ---------------- stations: one panel per chapter, ⌈lines / 2⌉ pages, ≤ 2 lines per page ----------------
        // 每段一個框面板（邊框＋徽章）；每頁自己一個面板，粉筆頁全疊在粉筆區那一格
        var STA = CH.map(function (c, k) {
          var ls = chLines[k], np = pagesOf[k], g0 = FIXED && FIXED[k][0];
          // 段裡有粉筆頁，框面板（徽章）就放粉筆區；整段都是電腦畫面才放螢幕那一格（開場先上電腦畫面、再回黑板）
          var allScr = FIXED && FIXED[k].length && FIXED[k].every(function (g) { return g.screen != null; });
          var P = K.panel("ch" + c.n, allScr ? COL_SCREEN + g0.screen : COL_CHALK, 0);
          var pages = [], rem = ls.length, idx = 0;
          for (var j = 0; j < np; j++) {
            var fg = FIXED && FIXED[k][j], q = fg ? fg.lines.length : Math.ceil(rem / (np - j)), scr = fg && fg.screen != null ? fg.screen : null;
            var PP = K.panel("ch" + c.n + "p" + j, scr != null ? COL_SCREEN + scr : COL_CHALK, 0);
            pages.push({ j: j, x: 0, y: 0, w: PW, h: PH, top: 104, lines: ls.slice(idx, idx + q), P: PP, bx: PP.ox + PW / 2, by: PP.oy + PH / 2, screen: scr });
            idx += q; rem -= q;
          }
          return { n: c.n, k: k, chapter: c, key: c.key, title: c.title, start: c.start, end: c.end, P: P, pages: pages, lines: ls, tone: K.CHAPTER_TONES[(c.n - 1) % K.CHAPTER_TONES.length], border: BORDERS[(c.n - 1) % BORDERS.length], notes: (D.notes && D.notes[c.key]) || [] };
        });

        // ---------------- headline rows: the narration line wrapped by estimated width, balanced, broken after a clause ----------------
        var PUNCT0 = /^[，。：；、！？,.!?;:）」”’…—–\-\/~]/;
        function unitW(words, k) {
          var u = words[k][0], nu = k + 1 < words.length ? words[k + 1][0] : null;
          var sp = nu && !PUNCT0.test(nu) && !/[（「“‘，。：；、！？–\-\/~]$/.test(u) && (/[A-Za-z0-9%]$/.test(u) || /^[A-Za-z0-9]/.test(nu)) ? 0.3 : 0;
          return wlen(u) + sp;
        }
        // unit indices where each row starts (row 0 = 0); pen = cost of breaking anywhere but after a clause;
        // balanced: rows of equal length (titles) instead of rows that run to the edge (headlines)
        function rowStarts(words, maxEm, pen, balanced) {
          var n = words.length, w = [], k;
          for (k = 0; k < n; k++) w.push(unitW(words, k));
          var total = w.reduce(function (a, b) { return a + b; }, 0);
          if (total <= maxEm || n < 2) return [0];
          var after = function (j) { return /[，。：；、！？,.!?;:]$/.test(words[j - 1][0]); };
          var latinPair = function (j) { return /[A-Za-z0-9]$/.test(words[j - 1][0]) && /^[A-Za-z0-9]/.test(words[j][0]); };
          // between two CJK units a break may split a word (word times can be per character); next to a Latin term it cannot
          var cjkPair = function (j) { return /[\u3400-\u9fff]$/.test(words[j - 1][0]) && /^[\u3400-\u9fff]/.test(words[j][0]); };
          // rows run (nearly) to the edge the way a teacher writes; a clause end near the edge is the best break,
          // a very short last row is avoided
          for (var rows = Math.max(2, Math.ceil(total / maxEm)); rows <= Math.min(n, 6); rows++) {
            var memo = {}, target = balanced ? total / rows : maxEm * 0.92;
            var f = function (i, r) {
              var key = i * 8 + r;
              if (key in memo) return memo[key];
              var best = { c: Infinity, cut: [] }, acc = 0;
              for (var j = i + 1; j <= n; j++) {
                acc += w[j - 1];
                if (j < n && PUNCT0.test(words[j][0])) continue; // a row never starts with punctuation
                if (r === 1 && j < n) continue;
                if (r > 1 && j === n) break;
                var over = acc > maxEm * 1.02;
                if (over && j > i + 1) break;
                var brk = after(j) ? 0 : latinPair(j) ? 0.4 : cjkPair(j) ? pen : pen * 0.4;
                var c = (over ? 5 : 0) + (j < n ? Math.pow((acc - target) / maxEm, 2) + brk : balanced ? Math.pow((acc - target) / maxEm, 2) : acc < maxEm * 0.25 ? 0.15 : 0);
                var rest = r === 1 ? { c: 0, cut: [] } : f(j, r - 1);
                if (c + rest.c < best.c) best = { c: c + rest.c, cut: [j].concat(rest.cut) };
              }
              return (memo[key] = best);
            };
            var b = f(0, rows);
            if (b.c < Infinity) return [0].concat(b.cut.slice(0, rows - 1));
          }
          return [0];
        }

        var HEAD = {}, SLOT = {}, PAGE = {}, SCREENS = [];
        // 螢幕區 16:9、寬 1600：鏡頭放大 1920 / 1600 倍時剛好滿版；上方留給章節徽章
        var SW = 1600, SH = 900;
        var CAP_H = Math.round(2 * 64 * 1.3), CAP_TOP = Math.round(PH - 48 - CAP_H);
        STA.forEach(function (st) {
          st.pages.forEach(function (pg) {
            var ls = pg.lines;
            if (!ls.length) return;
            if (pg.screen != null) {
              var scr = { k: pg.screen, P: pg.P, x: pg.x + Math.round((PW - SW) / 2), y: PH - SH - 20, w: SW, h: SH, lines: ls.slice(), kind: D.screens[pg.screen].kind, page: pg, station: st,
                // 進出時刻在這裡定一次，鏡頭與 beats 共用：開口前 1.4 秒到面板畫框，最後一句講完停 0.3 秒就拉遠
                tIn: drawAt(ls[0]) - 1.4, tOut: doneAt(ls[ls.length - 1]) + 0.3 };
              SCREENS[pg.screen] = scr;
              ls.forEach(function (li) {
                PAGE[li] = { st: st, pg: pg };
                SLOT[li] = { P: pg.P, x: scr.x, y: scr.y, w: SW, h: SH, page: pg, station: st, line: li, screen: scr };
              });
              return;
            }
            var picTop = pg.top, picH = Math.round(CAP_TOP - 34 - picTop);
            ls.forEach(function (li) {
              PAGE[li] = { st: st, pg: pg };
              SLOT[li] = { P: pg.P, x: pg.x + PAD, y: picTop, w: PW - 2 * PAD, h: picH, page: pg, station: st, line: li };
              HEAD[li] = { P: pg.P, rows: [], built: null };
            });
          });
        });

        // api.head(line, { tones }): dummy stub for compatibility
        function head(li, o) {
          var h = HEAD[li];
          if (!h) return { rows: [], chars: [], end: 0, line: story.line(li) };
          if (h.built) return h.built;
          h.built = { rows: [], chars: [], end: 0, line: story.line(li) };
          return h.built;
        }

        // ---------------- the masthead (报头): the closing line, written last ----------------
        var MAST = null;
        if (END && LAY.mast) {
          var PM = K.panel("pM", LAY.mast.col, LAY.mast.row);
          var Lend = story.line(END), ew = Lend.words, kc = -1;
          for (var q0 = 0; q0 < Math.min(ew.length, 6); q0++) if (/[：:]/.test(ew[q0][0])) { kc = q0; break; }
          if (kc >= 0 && wlen(ew.slice(0, kc + 1).map(function (w) { return w[0]; }).join("")) > 6) kc = -1;
          var mainW = ew.slice(kc + 1), top0 = kc >= 0 ? 300 : 220, tRows = null, tSize = 170;
          [170, 150, 132, 116, 100, 88].some(function (sz) {
            tSize = sz;
            tRows = rowStarts(mainW, (PM.w - 200) / sz, 0.6, true);
            return tRows.length <= 3 && top0 + tRows.length * sz * 1.3 <= 960;
          });
          var rows = [], maxW = 0;
          if (kc >= 0) rows.push({ x: 90, y: 200, size: 72, cls: "kl cw" });
          tRows.forEach(function (k, r) {
            var k0 = k, k1 = r + 1 < tRows.length ? tRows[r + 1] : mainW.length, wsum = 0;
            for (var u = k0; u < k1; u++) wsum += unitW(mainW, u);
            maxW = Math.max(maxW, wsum * tSize);
            rows.push({ x: 90, y: Math.round(top0 + r * tSize * 1.3), size: tSize, k: k + kc + 1 });
          });
          if (kc < 0) rows[0].k = undefined;
          var bottom = top0 + tRows.length * tSize * 1.3, freeX = 90 + maxW + 90;
          var slot = PM.w - freeX - 50 >= 420 ? { side: "right", x: Math.round(freeX), y: 220, w: Math.round(PM.w - freeX - 50), h: 720 } : 950 - bottom >= 200 ? { side: "below", x: 90, y: Math.round(bottom + 20), w: PM.w - 180, h: Math.round(930 - bottom) } : null;
          if (slot) Object.assign(slot, { P: PM, line: END });
          MAST = { P: PM, prefix: kc >= 0, rows: rows, rowTones: kc >= 0 ? ["w", "y", "p", "y"] : ["y", "p", "y"], slot: slot, size: tSize };
          if (slot) SLOT[END] = slot;
        }

        // ---------------- the review panel ----------------
        var PR = REC && LAY.recap ? K.panel("pR", LAY.recap.col, LAY.recap.row) : null;

        // ---------------- placeholders: a storyboard frame in chalk, one per line ----------------
        function keyPhrase(text) {
          var parts = text.split(/[，。：；！？]+|[,.!?;:](?=\s|$)/).map(function (s) { return s.trim(); }).filter(Boolean);
          if (!parts.length) return text;
          var lat = parts.filter(function (s) { return /[A-Za-z0-9]/.test(s); }), pool = lat.length ? lat : parts;
          return pool.reduce(function (a, b) { return wlen(b) > wlen(a) ? b : a; });
        }
        function noteFor(li) {
          var st = PAGE[li].st, j = st.lines.indexOf(li), notes = st.notes;
          if (j < notes.length) return { text: j === st.lines.length - 1 ? notes.slice(j).join("；") : notes[j], beat: true };
          return { text: keyPhrase(story.line(li).text), beat: false };
        }
        function clapper(x, y) {
          return G.rect(x, y + 10, 40, 26) + " M " + x + " " + (y + 10) + " L " + (x + 40) + " " + (y + 2) + " M " + (x + 12) + " " + (y + 8) + " L " + (x + 6) + " " + (y + 18) + " M " + (x + 26) + " " + (y + 5) + " L " + (x + 20) + " " + (y + 16);
        }
        function placeholder(li) {
          var s = SLOT[li], L = story.line(li);
          if (!s || li === END) return null;
          var P = s.P, x = s.x, y = s.y, w = s.w, h = s.h, t0 = Math.max(0, L.start - 0.15), dur = Math.max(0.6, L.end - L.start);
          // the frames of a page are all drawn when the page's first line starts (a panel never sits half empty);
          // the tag, the note and the ticks come at the line's own time
          var pls = s.page.lines, tf = Math.min(t0, Math.max(0, story.line(pls[0]).start - 0.15) + 0.2 * Math.max(0, pls.indexOf(li)));
          var out = { rect: s, line: li, parts: [] };
          // the frame + the 「待演绎」 tag (a clapperboard and a stamped label) + which line it is
          out.frame = S(P, G.rect(x, y, w, h), "m", 3, tf, 0.35, { sprite: false });
          out.tag = [S(P, clapper(x + 26, y + 16), "o", 3, t0 + 0.1, 0.2, { sprite: false }), T(P, x + 78, y + 14, 32, [["待演绎", t0 + 0.15, t0 + 0.4, "kl co"]], { sprite: false }), S(P, G.rect(x + 14, y + 10, 196, 54), "o", 3, t0 + 0.38, 0.16, { sprite: false, kind: "tap" })];
          var no = "第 " + li + " 句";
          out.num = T(P, Math.round(x + w - 26 - wlen(no) * 30), y + 20, 30, [[no, tf + 0.2, tf + 0.4, "cm"]], { sprite: false });
          // the beat ruler: one tick per spoken unit at its time (terms taller, in yellow), the line's start / end times
          var ry = y + h - 58, x0 = x + 44, x1 = x + w - 44, spoken = story.spoken(li);
          out.ruler = [S(P, G.line(x0, ry, x1, ry, 2), "m", 2.6, tf + 0.05, 0.3, { sprite: false })];
          spoken.forEach(function (u) {
            var tx = x0 + clamp((u[1] - L.start) / dur, 0, 1) * (x1 - x0), term = /[A-Za-z0-9]/.test(u[0]), hh = term ? 15 : 9;
            out.ruler.push(S(P, "M " + tx.toFixed(1) + " " + (ry - hh) + " L " + tx.toFixed(1) + " " + (ry + hh), term ? "y" : "m", term ? 4 : 3, u[1], 0.05, { sprite: false }));
          });
          var a = L.start.toFixed(1) + "s", b = L.end.toFixed(1) + "s";
          out.ruler.push(T(P, x0 - 4, ry + 14, 30, [[a, tf + 0.1, tf + 0.3, "cm lat"]], { sprite: false }));
          out.ruler.push(T(P, Math.round(x1 + 4 - wlen(b) * 30), ry + 14, 30, [[b, tf + 0.15, tf + 0.35, "cm lat"]], { sprite: false }));
          // the beat note (story.notes) or the line's key phrase, centred, written at a steady hand; a short term after
          // the last "：" gets its own row in yellow 美术字
          // (a space where Latin / numbers touch CJK, so a row can break there and terms stay whole)
          var nt = noteFor(li), text = nt.text.replace(/[。.]\s*$/, "").replace(/([\u3400-\u9fff])([A-Za-z0-9$])/g, "$1 $2").replace(/([A-Za-z0-9%])([\u3400-\u9fff])/g, "$1 $2");
          var ci = text.lastIndexOf("："), tail = null;
          if (ci > 0 && wlen(text.slice(ci + 1)) <= 8 && wlen(text.slice(ci + 1)) > 0) { tail = text.slice(ci + 1); text = text.slice(0, ci + 1); }
          var ny0 = y + 82, ny1 = ry - 44, inner = w - 170, size = 40, rowsT = [];
          (w > 1200 ? [80] : []).concat([72, 64, 56, 50, 44, 40]).some(function (sz) {
            size = sz;
            rowsT = K.wrap(text, inner / sz, true).concat(tail ? [tail] : []);
            var wide = rowsT.every(function (r) { return wlen(r) * sz <= w - 120; });
            return wide && rowsT.length * sz * 1.32 <= ny1 - ny0 && rowsT.length <= 3;
          });
          var em = rowsT.reduce(function (n, r) { return n + wlen(r); }, 0), cps = clamp(em / (0.42 * dur), 12, 30);
          var by = ny0 + (ny1 - ny0 - rowsT.length * size * 1.32) / 2, tw = L.start + 0.2, chars = [];
          out.note = rowsT.map(function (r, k) {
            var isTail = tail && k === rowsT.length - 1;
            var wr = seq(P, Math.round(x + (w - wlen(r) * size) / 2), Math.round(by + k * size * 1.32), size, [[r, isTail ? "kl cy" : "cw"]], tw, cps, { sprite: false });
            tw = wr.end + 0.04;
            chars = chars.concat(wr.chars);
            return wr;
          });

                key(scr.tIn + 0.6, pc[0], pc[1], 1.0, 0, 0, true);
                key(drawAt(L.i) - 0.05, cx, cy, zs, 0, 0, true);
              } else key(0, cx, cy, zs, 0, 0, true); // 片頭就是電腦畫面：第一格已經滿版，不先看面板
            }
            // 螢幕裡不漂移：travel 鍵擋住 beats 以外的 drift，推近細節交給 api.look
            last = key(Math.max(L.end, L.start + 0.5), cx, cy, zs, 0, 0, true).slice(1);
            var isLast = L.i === scr.lines[scr.lines.length - 1];
            if (isLast) {
              last = key(scr.tOut + 0.6, pc[0], pc[1], 1.0, 0, 0, true).slice(1);
            }
            // 拉遠完才准出發：把「上一句結尾」設成加上 LEAVE 後剛好是拉遠結束
            prev = { L: isLast ? { i: L.i, start: L.start, end: scr.tOut + 0.6 - LEAVE } : L, pg: sp.pg, zk: KEYS[KEYS.length - 1], zt: -1 };
            return;
          }
          if (!prev) {
            key(0, sp.bx, sp.by, 1.0);
            last = key(Math.max(0.5, L.end), sp.Z[0], sp.Z[1], 1.0).slice(1);
          } else if (prev.pg !== sp.pg) {
            var newChap = PAGE[L.i].st !== PAGE[prev.L.i].st;
            var dep = travel(last, sp.A, drawAt(L.i) - SETTLE, (prev.L.end + (prev.L.hold || 0)) + LEAVE);
            if (dep < prev.zt) { prev.zk[0] = Math.max(prev.L.start + 0.2, dep); }
            last = key(Math.max(L.end, L.start + 0.6), sp.Z[0], sp.Z[1], sp.Z[2]).slice(1);
          } else {
            key(L.start + 0.08, sp.A[0], sp.A[1], sp.A[2]);
            last = key(Math.max(L.end, L.start + 0.5), sp.Z[0], sp.Z[1], sp.Z[2]).slice(1);
          }
          prev = { L: L, pg: sp.pg, zk: KEYS[KEYS.length - 1], zt: KEYS[KEYS.length - 1][0] };
        });
        var lastLineEnd = prev ? prev.L.end : 0;
        var WL = GAP + LAY.lessonCols * (PW + GAP), whole = [WL / 2, (B.H + 60) / 2, Math.min((1920 * 0.94) / (WL + 128), (1080 * 0.9) / (B.H + 200))];
        var tail0 = REC ? REC.start - 0.15 : DUR - 0.3;
        if (MAST) {
          var Le = story.line(END), mx = MAST.P.ox + PW / 2, my = MAST.P.oy + PH / 2;
          var arrive = Le.start - SETTLE, dep2 = travel(last || [mx, my, 1], [mx, my, 1.0], arrive, lastLineEnd + LEAVE);
          if (prev && dep2 < prev.zt) prev.zk[0] = Math.max(prev.L.start + 0.2, dep2);
          // 結語講完不拉遠看整面黑板（使用者覺得突兀），停在結語上，接著照一般換頁走到複習頁
          last = [mx, my, 1.0];
          prev = { L: Le, pg: null, zk: KEYS[KEYS.length - 1], zt: KEYS[KEYS.length - 1][0] };
          lastLineEnd = Le.end;
        }
        if (REC && PR) {
          var rxp = PR.ox + PW / 2, ryp = PR.oy + PH / 2;
          var dep3 = travel(last || [rxp, ryp, 1], [rxp, ryp, 1.0], REC.start + 0.55, lastLineEnd + LEAVE);
          if (prev && dep3 < prev.zt) prev.zk[0] = Math.max(prev.L.start + 0.2, dep3);
          key(Math.max(DUR, REC.start + 1.2), rxp, ryp, 1.0);
          K.mark("lessonEnd", REC.start);
        } else {
          var lk = KEYS[KEYS.length - 1];
          key(Math.max(DUR, lk[0] + 0.5), lk[1], lk[2], lk[3]);
        }
        // the beats' own camera keys replace the drift keys near them (travels stay)
        LOOKS.forEach(function (lk) {
          for (var i = KEYS.length - 1; i >= 0; i--) if (!KEYS[i].travel && Math.abs(KEYS[i][0] - lk[0]) < 0.35 && KEYS[i][0] > 0) KEYS.splice(i, 1);
          var k = lk.slice(); k.travel = true; KEYS.push(k);
        });
        KEYS.sort(function (a, b) { return a[0] - b[0]; });
        var CAM = [];
        KEYS.forEach(function (k) {
          var p = CAM[CAM.length - 1];
          if (p && k[0] - p[0] < 0.05) { if (k.travel || !p.travel) CAM[CAM.length - 1] = k; }
          else CAM.push(k);
        });
        K.camera(CAM);
        API.cameraKeys = CAM;

        // ---------------- draft tag ----------------
        if (D.draft) {
          // a screen-fixed tag over the moving board: chalk passing under it is intended
          var dt = document.createElement("div");
          dt.className = "v8-draft";
          dt.textContent = "草稿 · 无配音";
          dt.setAttribute("data-layout-allow-overlap", "");
          dt.setAttribute("data-layout-allow-occlusion", "");
          stage.appendChild(dt);
        }

        // ---------------- drive ----------------
        function frame(t) { K.render(t); if (beats.render) beats.render(t); }
        frame(0);
        window.__starter = API;
        var tl = gsap.timeline({ paused: true });
        var drive = { t: 0 };
        tl.to(drive, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { frame(tl.time()); } }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
