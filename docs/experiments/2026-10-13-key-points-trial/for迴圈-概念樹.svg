<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" data-root-id="root" data-contract-version="1.2" data-layout="progressive" role="img" aria-labelledby="mindmap-title"><title id="mindmap-title">固定次數的重複處理：for 迴圈</title><rect width="100%" height="100%" fill="#fffaf2"/><path data-from="root" data-to="for_structure" data-relation="" d="M330,250.0 C365,250.0 365,250.0 400,250.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="for_structure" data-to="loop_update" data-relation="" d="M700,250.0 C735,250.0 735,70.0 770,70.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="for_structure" data-to="loop_bounds" data-relation="" d="M700,250.0 C735,250.0 735,190.0 770,190.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="for_structure" data-to="read_n_data" data-relation="" d="M700,250.0 C735,250.0 735,310.0 770,310.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="for_structure" data-to="trace_and_test" data-relation="" d="M700,250.0 C735,250.0 735,430.0 770,430.0" fill="none" stroke="#b97755" stroke-width="2"/><g data-node-id="root" data-node-kind="concept"><title data-node-label="">固定次數的重複處理：for 迴圈</title><desc data-node-explanation=""></desc><desc data-node-quote=""></desc><rect x="30" y="204.0" width="300" height="92" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="50" y="234.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">固定次數的重複處理：for 迴</text><text x="50" y="260.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">圈</text></g><g data-node-id="for_structure" data-node-kind="concept" data-handout-page="2"><title data-node-label="">for結構與改寫</title><desc data-node-explanation="">for 將計數控制的「初始化」、「繼續條件」與「更新」集中在括號內以分號隔開。進入迴圈時只執行一次初始化；每次執行本體前先檢查條件，成立才執行；本體結束後執行更新，再重新檢查條件。</desc><desc data-node-quote="">`for` 可以把這三個控制次數的部分集中在一起：</desc><rect x="400" y="210.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="420" y="240.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">for結構與改寫</text></g><g data-node-id="loop_update" data-node-kind="concept" data-handout-page="3"><title data-node-label="">計數變數更新</title><desc data-node-explanation="">i = i + 1、i += 1 與 i++ 在此效果相同，都是每次讓變數增加 1。若需要改變步進間隔（例如每次加 2 產生偶數），則可寫 i += 2。</desc><desc data-node-quote="">以下三種寫法，在這裡都能讓 `i` 增加 `1`：</desc><rect x="770" y="30.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="790" y="60.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">計數變數更新</text></g><g data-node-id="loop_bounds" data-node-kind="concept" data-handout-page="4"><title data-node-label="">迴圈次數與邊界</title><desc data-node-explanation="">計數從 0 開始時，變數範圍是 0 到 N-1，條件需用 &lt; N（共 N 次）；若從 1 開始，範圍是 1 到 N，條件需用 &lt;= N（共 N 次）。若從 0 開始誤用 &lt;= N 會多執行一次（N+1 次）；從 1 開始誤用 &lt; N 則會少執行一次（N-1 次）。</desc><desc data-node-quote="">```c
for (int i = 0; i &lt; N; i++) {
    printf("目前 i = %d\n", i);
}
```</desc><rect x="770" y="150.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="790" y="180.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">迴圈次數與邊界</text></g><g data-node-id="read_n_data" data-node-kind="concept" data-handout-page="5"><title data-node-label="">讀取N筆資料實作</title><desc data-node-explanation="">任務需求是「讀取一筆後立即印出一筆」，不需在記憶體中保留所有歷史數據。迴圈由計數變數 i 控制從 1 到 N 重複執行 N 次，每次讀入的新溫度值直接覆蓋同一個 double 變數並印出即可。</desc><desc data-node-quote="">for (int i = 1; i &lt;= N; i++) {
        printf("請輸入第 %d 筆溫度：", i);</desc><rect x="770" y="270.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="790" y="300.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">讀取N筆資料實作</text></g><g data-node-id="trace_and_test" data-node-kind="concept" data-handout-page="6"><title data-node-label="">追蹤表與測試</title><desc data-node-explanation="">條件判斷會執行 4 次。前 3 次條件成立（i 為 1、2、3）並執行本體與更新；第 4 次判斷時 i 增加至 4，條件不成立，程式直接離開迴圈，不再執行本體或更新。</desc><desc data-node-quote="">```c
for (int i = 1; i &lt;= 3; i = i + 1) {
    printf("%d\n", i);
}
```</desc><rect x="770" y="390.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="790" y="420.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">追蹤表與測試</text></g></svg>