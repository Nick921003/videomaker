<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="260" viewBox="0 0 1470 260" data-root-id="root" data-contract-version="1.2" data-layout="progressive" role="img" aria-labelledby="mindmap-title"><title id="mindmap-title">變數與資料型別</title><rect width="100%" height="100%" fill="#fffaf2"/><path data-from="root" data-to="var_role_concept" data-relation="" d="M330,130.0 C365,130.0 365,130.0 400,130.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="var_role_concept" data-to="data_types" data-relation="" d="M700,130.0 C735,130.0 735,130.0 770,130.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="data_types" data-to="io_format" data-relation="" d="M1070,130.0 C1105,130.0 1105,70.0 1140,70.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="data_types" data-to="type_output_diff" data-relation="" d="M1070,130.0 C1105,130.0 1105,190.0 1140,190.0" fill="none" stroke="#b97755" stroke-width="2"/><g data-node-id="root" data-node-kind="concept"><title data-node-label="">變數與資料型別</title><desc data-node-explanation=""></desc><desc data-node-quote=""></desc><rect x="30" y="90.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="50" y="120.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">變數與資料型別</text></g><g data-node-id="var_role_concept" data-node-kind="concept" data-handout-page="2"><title data-node-label="">變數與賦值</title><desc data-node-explanation="">C 語言中的等號「=」不是數學上的相等，而是賦值運算。執行時會先讀取右側算式算出新值（舊分數加 5），接著把結果寫入左側變數 score 的記憶體空間中覆蓋舊值。</desc><desc data-node-quote="">`=` 在 C 語言中**不是數學上的「等於」**，而是「**把右邊的值放進左邊的變數**」。</desc><rect x="400" y="90.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="420" y="120.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">變數與賦值</text></g><g data-node-id="data_types" data-node-kind="concept" data-handout-page="3"><title data-node-label="">基本資料型別</title><desc data-node-explanation="">int 型別只能存放整數，將帶有小數的數值指派給 int 時，C 語言會直接截斷小數部分，而非進行四捨五入。若需保留小數精度，應改用 float 或推薦的 double 型別。</desc><desc data-node-quote="">| 型別 | 常見大小 | 用途 | 格式符號（printf / scanf） | 範例值 |
| --- | --- | --- | --- | --- |
| `int` | 4 bytes | 整數（人數、次數、分數） | `%d` | `42`、`-7`、`0` |
| `float` | 4 bytes | 單精度小數（約 6～7 位有效數字） | `%f` / `%f` | `3.14f` |
| `double` | 8 bytes | 倍精度小數（約 15～16 位有效數字） | `%f` / `%lf` | `3.14159265358979` |
| `char` | 1 byte | 單一字符（字母、符號、數字字元） | `%c` | `'A'`、`'7'`、`'#'` |</desc><rect x="770" y="90.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="790" y="120.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">基本資料型別</text></g><g data-node-id="io_format" data-node-kind="concept" data-handout-page="4"><title data-node-label="">格式符號與取址</title><desc data-node-explanation="">scanf 需要取得變數在記憶體中的存放位址才能寫入資料，因此變數名前必須加「&amp;」取址；且 scanf 對 float 與 double 格式要求不同，讀取 double 必須精確對應為 %lf。</desc><desc data-node-quote="">&gt; ⚠️ **`scanf` 讀取 `double` 一定要用 `%lf`**；`printf` 輸出時寫 `%f` 即可（因為 `float` 會被自動提升為 `double`）。這是最常見的初學者錯誤之一。</desc><rect x="1140" y="30.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="1160" y="60.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">格式符號與取址</text></g><g data-node-id="type_output_diff" data-node-kind="concept" data-handout-page="5"><title data-node-label="">型別影響運算</title><desc data-node-explanation="">在 C 語言中，兩個整數相除會進行整數除法，小數會被捨棄只保留整數商 3；只有當運算對象包含浮點數（例如 7.0 / 2.0 或 7 / 2.0）時，才會執行浮點數除法得出 3.500000。</desc><desc data-node-quote="">int main(void) {
    int    a = 7;
    int    b = 2;
    double c = 7.0;
    double d = 2.0;</desc><rect x="1140" y="150.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="1160" y="180.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">型別影響運算</text></g></svg>