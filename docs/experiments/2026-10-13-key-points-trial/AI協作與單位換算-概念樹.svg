<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="500" viewBox="0 0 1840 500" data-root-id="root" data-contract-version="1.2" data-layout="progressive" role="img" aria-labelledby="mindmap-title"><title id="mindmap-title">電子實驗室單位換算與 C 語言實作</title><rect width="100%" height="100%" fill="#fffaf2"/><path data-from="root" data-to="unit_conversion_logic" data-relation="" d="M330,250.0 C365,250.0 365,130.0 400,130.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="unit_conversion_logic" data-to="pseudocode_structure" data-relation="" d="M700,130.0 C735,130.0 735,130.0 770,130.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="pseudocode_structure" data-to="c_code_translation" data-relation="" d="M1070,130.0 C1105,130.0 1105,130.0 1140,130.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="c_code_translation" data-to="type_double_choice" data-relation="" d="M1440,130.0 C1475,130.0 1475,70.0 1510,70.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="root" data-to="calculation_verification" data-relation="" d="M330,250.0 C365,250.0 365,310.0 400,310.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="c_code_translation" data-to="compiler_error_debug" data-relation="" d="M1440,130.0 C1475,130.0 1475,190.0 1510,190.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="root" data-to="ai_prompting_workflow" data-relation="" d="M330,250.0 C365,250.0 365,430.0 400,430.0" fill="none" stroke="#b97755" stroke-width="2"/><g data-node-id="root" data-node-kind="concept"><title data-node-label="">電子實驗室單位換算與 C 語言實作</title><desc data-node-explanation=""></desc><desc data-node-quote=""></desc><rect x="30" y="204.0" width="300" height="92" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="50" y="234.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">電子實驗室單位換算與 C 語</text><text x="50" y="260.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">言實作</text></g><g data-node-id="unit_conversion_logic" data-node-kind="concept" data-handout-page="2"><title data-node-label="">毫單位換算邏輯</title><desc data-node-explanation="">從大單位（V）轉換到小單位（mV）時，所代表的數值量級會變大，1 個基本單位等同於 1000 個毫單位，因此必須乘以 1000；反向從小單位換到大單位時數值變小，才需要除以 1000。</desc><desc data-node-quote="">### 本單元要處理的兩條公式</desc><rect x="400" y="90.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="420" y="120.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">毫單位換算邏輯</text></g><g data-node-id="pseudocode_structure" data-node-kind="concept" data-handout-page="3"><title data-node-label="">換算虛擬碼結構</title><desc data-node-explanation="">將計算拆成輸入、處理、輸出，只描述「做什麼」而不受語法細節干擾。當程式出錯時，可以快速比對虛擬碼，迅速釐清究竟是換算邏輯寫錯，還是 C 語言的型別或語法出錯。</desc><desc data-node-quote="">延續前一單元的「輸入 → 處理 → 輸出」三段結構，先不要碰程式語法，用中文把步驟寫清楚。</desc><rect x="770" y="90.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="790" y="120.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">換算虛擬碼結構</text></g><g data-node-id="c_code_translation" data-node-kind="concept" data-handout-page="4"><title data-node-label="">虛擬碼轉 C 程式</title><desc data-node-explanation="">在 scanf 讀取輸入時，變數名稱前必須加上取址符號 &amp;，代表將輸入寫入該變數記憶體；而在 printf 輸出時，直接傳入變數名稱即可，並搭配 %.2f 格式化指定印到小數點後兩位。</desc><desc data-node-quote="">int main() {
    double voltage;      /* 單位：V，可能有小數，例如 1.5 */</desc><rect x="1140" y="90.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="1160" y="120.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">虛擬碼轉 C 程式</text></g><g data-node-id="type_double_choice" data-node-kind="concept" data-handout-page="5"><title data-node-label="">浮點數型別選擇</title><desc data-node-explanation="">輸入數值可能包含小數點。若宣告為 int 並以 %d 讀入 1.5，小數點與其後的數值會被截斷留在緩衝區，變數只會收到 1，且 int 乘整數運算無法產生小數，造成計算結果少 500 mV 且編譯器不會報錯。</desc><desc data-node-quote="">這是本單元最容易出錯、也最需要與 AI 反覆確認的地方。判斷原則很簡單：**這個變數會不會出現小數？**</desc><rect x="1510" y="30.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="1530" y="60.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">浮點數型別選擇</text></g><g data-node-id="calculation_verification" data-node-kind="concept" data-handout-page="6"><title data-node-label="">手算比對測試驗證</title><desc data-node-explanation="">型別截斷等邏輯錯誤能正常編譯執行，編譯器不會主動報錯。驗證標準是先依公式手算出預期數值（1500.00 mV、250.00 mW），再將數值輸入程式，檢查實際輸出與手算結果是否完全相符。</desc><desc data-node-quote="">驗證（verification）的標準做法是：**先手算、再輸入、最後比對**。</desc><rect x="400" y="270.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="420" y="300.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">手算比對測試驗證</text></g><g data-node-id="compiler_error_debug" data-node-kind="concept" data-handout-page="7"><title data-node-label="">編譯器錯誤解讀</title><desc data-node-explanation="">這表示以 scanf 讀取 double 變數時誤用了 %f。雖然 printf 輸出時 float 與 double 格式常能互通，但 scanf 讀入時必須嚴格對應型別：%f 對應 float*，而 double* 必須指定 %lf 才能正確讀取。</desc><desc data-node-quote="">編譯器（例如 `gcc`）的錯誤訊息其實是**最有用的老師**：它會告訴你「哪一行、什麼問題」。常見的幾種如下表。</desc><rect x="1510" y="150.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="1530" y="180.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">編譯器錯誤解讀</text></g><g data-node-id="ai_prompting_workflow" data-node-kind="concept" data-handout-page="8"><title data-node-label="">AI 協作除錯原則</title><desc data-node-explanation="">AI 的角色是協助看懂問題與檢查思考盲點。直接取得完整解答會失去理解錯誤的機會。</desc><desc data-node-quote="">AI 在這裡的角色不是「幫我寫完作業」，而是「協助我看懂問題，並檢查自己的修正是否合理」。
遇到錯誤時，先看編譯器指出的行號，試著自己找原因；仍不確定時，再把相關程式碼、完整錯誤訊息，以及你原本想達成的結果提供給 AI。例如：
我用 GCC 編譯下面的 C 程式時出現這個錯誤。請解釋錯誤原因，給我修正方向，先不要直接提供完整程式。</desc><rect x="400" y="390.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="420" y="420.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">AI 協作除錯原則</text></g></svg>