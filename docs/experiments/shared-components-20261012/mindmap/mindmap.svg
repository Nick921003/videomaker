<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="2576" viewBox="0 0 1470 2576" data-root-id="root" data-contract-version="1.1" data-layout="progressive" role="img" aria-labelledby="mindmap-title"><title id="mindmap-title">C 迴圈：看懂每一輪</title><rect width="100%" height="100%" fill="#fffaf2"/><path data-from="root" data-to="problem" data-relation="主題" d="M330,1288.0 C365,1288.0 365,405.0 400,405.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="problem" data-to="detail_0" data-relation="meaning" d="M700,405.0 C735,405.0 735,89.0 770,89.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="problem" data-to="detail_1" data-relation="usage" d="M700,405.0 C735,405.0 735,247.0 770,247.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="root" data-to="three_parts" data-relation="主題" d="M330,1288.0 C365,1288.0 365,1538.0 400,1538.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="three_parts" data-to="detail_2" data-relation="meaning" d="M700,1538.0 C735,1538.0 735,879.0 770,879.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="three_parts" data-to="detail_3" data-relation="meaning" d="M700,1538.0 C735,1538.0 735,1024.0 770,1024.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="three_parts" data-to="detail_4" data-relation="usage" d="M700,1538.0 C735,1538.0 735,1169.0 770,1169.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="problem" data-to="trace" data-relation="實際走讀" d="M700,405.0 C735,405.0 735,563.0 770,563.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="trace" data-to="detail_5" data-relation="meaning" d="M1070,563.0 C1105,563.0 1105,405.0 1140,405.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="trace" data-to="detail_6" data-relation="example" d="M1070,563.0 C1105,563.0 1105,563.0 1140,563.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="trace" data-to="detail_7" data-relation="usage" d="M1070,563.0 C1105,563.0 1105,721.0 1140,721.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="three_parts" data-to="choose" data-relation="寫法比較" d="M700,1538.0 C735,1538.0 735,1406.0 770,1406.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="choose" data-to="detail_8" data-relation="meaning" d="M1070,1406.0 C1105,1406.0 1105,1327.0 1140,1327.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="choose" data-to="detail_9" data-relation="usage" d="M1070,1406.0 C1105,1406.0 1105,1485.0 1140,1485.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="three_parts" data-to="boundary" data-relation="條件邊界" d="M700,1538.0 C735,1538.0 735,1775.0 770,1775.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="boundary" data-to="detail_10" data-relation="meaning" d="M1070,1775.0 C1105,1775.0 1105,1643.0 1140,1643.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="boundary" data-to="detail_11" data-relation="pitfall" d="M1070,1775.0 C1105,1775.0 1105,1788.0 1140,1788.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="boundary" data-to="detail_12" data-relation="example" d="M1070,1775.0 C1105,1775.0 1105,1920.0 1140,1920.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="three_parts" data-to="termination" data-relation="更新遺漏" d="M700,1538.0 C735,1538.0 735,2131.0 770,2131.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="termination" data-to="detail_13" data-relation="meaning" d="M1070,2131.0 C1105,2131.0 1105,2065.0 1140,2065.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="termination" data-to="detail_14" data-relation="pitfall" d="M1070,2131.0 C1105,2131.0 1105,2210.0 1140,2210.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="root" data-to="recap" data-relation="主題" d="M330,1288.0 C365,1288.0 365,2421.0 400,2421.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="recap" data-to="detail_15" data-relation="meaning" d="M700,2421.0 C735,2421.0 735,2355.0 770,2355.0" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="recap" data-to="detail_16" data-relation="meaning" d="M700,2421.0 C735,2421.0 735,2500.0 770,2500.0" fill="none" stroke="#b97755" stroke-width="2"/><g data-node-id="root" data-node-kind="concept"><title data-node-label="">C 迴圈：看懂每一輪</title><desc data-node-explanation="">C 迴圈：看懂每一輪</desc><desc data-node-quote="">走讀時分四步：宣告變數並把累加器歸零、寫出迴圈的三個部分、
在主體裡累加、最後印出結果。</desc><rect x="30" y="1248.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="50" y="1278.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">C 迴圈：看懂每一輪</text></g><g data-node-id="problem" data-node-kind="concept"><title data-node-label="">程式走讀</title><desc data-node-explanation="">這是閱讀程式的四個部分；主體會依條件重複累加，離開迴圈後才印出結果。</desc><desc data-node-quote="">走讀時分四步：宣告變數並把累加器歸零、寫出迴圈的三個部分、
在主體裡累加、最後印出結果。</desc><rect x="400" y="365.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="420" y="395.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">程式走讀</text></g><g data-node-id="detail_0" data-node-kind="meaning"><title data-node-label="">這是閱讀程式的四個部分；主體會依條件重複累加，離開迴圈後才印出結果。</title><desc data-node-explanation=""></desc><desc data-node-quote="">走讀時分四步：宣告變數並把累加器歸零、寫出迴圈的三個部分、
在主體裡累加、最後印出結果。</desc><rect x="770" y="30.0" width="300" height="118" rx="10" fill="#fffdf7" stroke="#c69373"/><text x="790" y="60.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">這是閱讀程式的四個部分；主</text><text x="790" y="86.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">體會依條件重複累加，離開迴</text><text x="790" y="112.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">圈後才印出結果。</text></g><g data-node-id="detail_1" data-node-kind="usage"><title data-node-label="">先找歸零，再核對迴圈、主體與輸出；這是閱讀順序，並非只執行一次的控制流程。</title><desc data-node-explanation=""></desc><desc data-node-quote="">走讀時分四步：宣告變數並把累加器歸零、寫出迴圈的三個部分、
在主體裡累加、最後印出結果。</desc><rect x="770" y="188.0" width="300" height="118" rx="10" fill="#fffdf7" stroke="#c69373"/><text x="790" y="218.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">先找歸零，再核對迴圈、主體</text><text x="790" y="244.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">與輸出；這是閱讀順序，並非</text><text x="790" y="270.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">只執行一次的控制流程。</text></g><g data-node-id="three_parts" data-node-kind="concept"><title data-node-label="">迴圈三要素</title><desc data-node-explanation="">條件成立就繼續執行；不成立才離開。更新讓下一輪有機會接近結束。</desc><desc data-node-quote="">迴圈說穿了只有三件事：從哪裡開始、什麼時候繼續、每一輪怎麼變。</desc><rect x="400" y="1498.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="420" y="1528.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">迴圈三要素</text></g><g data-node-id="detail_2" data-node-kind="meaning"><title data-node-label="">條件成立就繼續執行；不成立才離開。更新讓下一輪有機會接近結束。</title><desc data-node-explanation=""></desc><desc data-node-quote="">迴圈說穿了只有三件事：從哪裡開始、什麼時候繼續、每一輪怎麼變。</desc><rect x="770" y="820.0" width="300" height="118" rx="10" fill="#fffdf7" stroke="#c69373"/><text x="790" y="850.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">條件成立就繼續執行；不成立</text><text x="790" y="876.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">才離開。更新讓下一輪有機會</text><text x="790" y="902.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">接近結束。</text></g><g data-node-id="detail_3" data-node-kind="meaning"><title data-node-label="">三個部分分別決定起點、能否繼續，以及每輪的變化。</title><desc data-node-explanation=""></desc><desc data-node-quote="">迴圈說穿了只有三件事：從哪裡開始、什麼時候繼續、每一輪怎麼變。</desc><rect x="770" y="978.0" width="300" height="92" rx="10" fill="#fffdf7" stroke="#c69373"/><text x="790" y="1008.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">三個部分分別決定起點、能否</text><text x="790" y="1034.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">繼續，以及每輪的變化。</text></g><g data-node-id="detail_4" data-node-kind="usage"><title data-node-label="">讀迴圈時先找到這三個部分，避免把繼續條件看成停止條件。</title><desc data-node-explanation=""></desc><desc data-node-quote="">迴圈說穿了只有三件事：從哪裡開始、什麼時候繼續、每一輪怎麼變。</desc><rect x="770" y="1110.0" width="300" height="118" rx="10" fill="#fffdf7" stroke="#c69373"/><text x="790" y="1140.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">讀迴圈時先找到這三個部分，</text><text x="790" y="1166.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">避免把繼續條件看成停止條件</text><text x="790" y="1192.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">。</text></g><g data-node-id="trace" data-node-kind="concept"><title data-node-label="">累加例子</title><desc data-node-explanation="">累加器先歸零；每輪把當下的 i 加進 sum，再更新 i。用狀態走讀核對每一步。</desc><desc data-node-quote="">int n = 5, sum = 0;
    for (int i = 1; i &lt;= n; i++) {
        sum += i;
    }</desc><rect x="770" y="523.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="790" y="553.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">累加例子</text></g><g data-node-id="detail_5" data-node-kind="meaning"><title data-node-label="">累加器先歸零；每輪把當下的 i 加進 sum，再更新 i。用狀態走讀核對每一步。</title><desc data-node-explanation=""></desc><desc data-node-quote="">int n = 5, sum = 0;
    for (int i = 1; i &lt;= n; i++) {
        sum += i;
    }</desc><rect x="1140" y="346.0" width="300" height="118" rx="10" fill="#fffdf7" stroke="#c69373"/><text x="1160" y="376.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">累加器先歸零；每輪把當下的</text><text x="1160" y="402.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20"> i 加進 sum，再更新 i。用狀</text><text x="1160" y="428.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">態走讀核對每一步。</text></g><g data-node-id="detail_6" data-node-kind="example"><title data-node-label="">第一輪：sum 從 0 加上 1，變成 1；第二輪再加 2，變成 3。</title><desc data-node-explanation=""></desc><desc data-node-quote="">int n = 5, sum = 0;
    for (int i = 1; i &lt;= n; i++) {
        sum += i;
    }</desc><rect x="1140" y="504.0" width="300" height="118" rx="10" fill="#fffdf7" stroke="#c69373"/><text x="1160" y="534.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">第一輪：sum 從 0 加上 1，</text><text x="1160" y="560.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">變成 1；第二輪再加 2，變成 </text><text x="1160" y="586.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">3。</text></g><g data-node-id="detail_7" data-node-kind="usage"><title data-node-label="">每一步同時對照程式行、i 和 sum，確認有沒有少跑一輪。</title><desc data-node-explanation=""></desc><desc data-node-quote="">int n = 5, sum = 0;
    for (int i = 1; i &lt;= n; i++) {
        sum += i;
    }</desc><rect x="1140" y="662.0" width="300" height="118" rx="10" fill="#fffdf7" stroke="#c69373"/><text x="1160" y="692.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">每一步同時對照程式行、i 和 </text><text x="1160" y="718.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">sum，確認有沒有少跑一輪</text><text x="1160" y="744.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">。</text></g><g data-node-id="choose" data-node-kind="concept"><title data-node-label="">for 與 while</title><desc data-node-explanation="">兩者都要照顧開始、條件與更新。選擇依情境：次數已知，或需要等某個事件發生。</desc><desc data-node-quote="">for 把這三件事寫在同一行，一眼就看得完，適合次數已經知道的情況。</desc><rect x="770" y="1366.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="790" y="1396.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">for 與 while</text></g><g data-node-id="detail_8" data-node-kind="meaning"><title data-node-label="">兩者都要照顧開始、條件與更新。選擇依情境：次數已知，或需要等某個事件發生。</title><desc data-node-explanation=""></desc><desc data-node-quote="">for 把這三件事寫在同一行，一眼就看得完，適合次數已經知道的情況。</desc><rect x="1140" y="1268.0" width="300" height="118" rx="10" fill="#fffdf7" stroke="#c69373"/><text x="1160" y="1298.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">兩者都要照顧開始、條件與更</text><text x="1160" y="1324.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">新。選擇依情境：次數已知，</text><text x="1160" y="1350.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">或需要等某個事件發生。</text></g><g data-node-id="detail_9" data-node-kind="usage"><title data-node-label="">次數已知優先考慮 for；等使用者輸入零等未知次數的情境可用 while。</title><desc data-node-explanation=""></desc><desc data-node-quote="">while 把三件事拆開來寫，適合次數事先不知道的情況，
例如一直讀到檔案結束、或是等使用者輸入零才停。</desc><rect x="1140" y="1426.0" width="300" height="118" rx="10" fill="#fffdf7" stroke="#c69373"/><text x="1160" y="1456.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">次數已知優先考慮 for；等使</text><text x="1160" y="1482.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">用者輸入零等未知次數的情境</text><text x="1160" y="1508.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">可用 while。</text></g><g data-node-id="boundary" data-node-kind="concept"><title data-node-label="">有效範圍</title><desc data-node-explanation="">先判斷有效範圍，再選符號。加到五要包含五；長度五的陣列只有索引零到四。</desc><desc data-node-quote="">因為題目要從一加到五，五本身要算進去，所以條件寫成小於等於。</desc><rect x="770" y="1735.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="790" y="1765.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">有效範圍</text></g><g data-node-id="detail_10" data-node-kind="meaning"><title data-node-label="">先判斷有效範圍，再選符號。加到五要包含五；長度五的陣列只有索引零到四。</title><desc data-node-explanation=""></desc><desc data-node-quote="">因為題目要從一加到五，五本身要算進去，所以條件寫成小於等於。</desc><rect x="1140" y="1584.0" width="300" height="118" rx="10" fill="#fffdf7" stroke="#c69373"/><text x="1160" y="1614.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">先判斷有效範圍，再選符號。</text><text x="1160" y="1640.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">加到五要包含五；長度五的陣</text><text x="1160" y="1666.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">列只有索引零到四。</text></g><g data-node-id="detail_11" data-node-kind="pitfall"><title data-node-label="">不能只背一個符號：總和範圍與陣列索引的終點不同。</title><desc data-node-explanation=""></desc><desc data-node-quote="">但如果今天是走訪一個長度為五的陣列，索引是從零開始、到四結束，
那裡就要用小於而不是小於等於。</desc><rect x="1140" y="1742.0" width="300" height="92" rx="10" fill="#fffdf7" stroke="#c69373"/><text x="1160" y="1772.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">不能只背一個符號：總和範圍</text><text x="1160" y="1798.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">與陣列索引的終點不同。</text></g><g data-node-id="detail_12" data-node-kind="example"><title data-node-label="">一加到五要包含五；陣列長度五時，索引五已經超出範圍。</title><desc data-node-explanation=""></desc><desc data-node-quote="">因為題目要從一加到五，五本身要算進去，所以條件寫成小於等於。</desc><rect x="1140" y="1874.0" width="300" height="92" rx="10" fill="#fffdf7" stroke="#c69373"/><text x="1160" y="1904.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">一加到五要包含五；陣列長度</text><text x="1160" y="1930.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">五時，索引五已經超出範圍。</text></g><g data-node-id="termination" data-node-kind="concept"><title data-node-label="">無窮迴圈</title><desc data-node-explanation="">while 的更新寫在主體裡，容易漏掉。若條件變數不變，下一次判斷還是成立。</desc><desc data-node-quote="">用 while 的時候忘記在主體裡更新條件變數，條件就永遠成立，程式停不下來。</desc><rect x="770" y="2091.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="790" y="2121.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">無窮迴圈</text></g><g data-node-id="detail_13" data-node-kind="meaning"><title data-node-label="">while 的更新寫在主體裡，容易漏掉。若條件變數不變，下一次判斷還是成立。</title><desc data-node-explanation=""></desc><desc data-node-quote="">用 while 的時候忘記在主體裡更新條件變數，條件就永遠成立，程式停不下來。</desc><rect x="1140" y="2006.0" width="300" height="118" rx="10" fill="#fffdf7" stroke="#c69373"/><text x="1160" y="2036.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">while 的更新寫在主體裡，容</text><text x="1160" y="2062.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">易漏掉。若條件變數不變，下</text><text x="1160" y="2088.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">一次判斷還是成立。</text></g><g data-node-id="detail_14" data-node-kind="pitfall"><title data-node-label="">忘記更新條件變數，會讓 while 的條件永遠成立。</title><desc data-node-explanation=""></desc><desc data-node-quote="">用 while 的時候忘記在主體裡更新條件變數，條件就永遠成立，程式停不下來。</desc><rect x="1140" y="2164.0" width="300" height="92" rx="10" fill="#fffdf7" stroke="#c69373"/><text x="1160" y="2194.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">忘記更新條件變數，會讓 whi</text><text x="1160" y="2220.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">le 的條件永遠成立。</text></g><g data-node-id="recap" data-node-kind="concept"><title data-node-label="">閱讀檢查</title><desc data-node-explanation="">用相同的檢查順序閱讀 for 與 while；核對邊界，再確認狀態朝結束前進。</desc><desc data-node-quote="">迴圈說穿了只有三件事：從哪裡開始、什麼時候繼續、每一輪怎麼變。</desc><rect x="400" y="2381.0" width="300" height="80" rx="10" fill="#f5e2cf" stroke="#c69373"/><text x="420" y="2411.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">閱讀檢查</text></g><g data-node-id="detail_15" data-node-kind="meaning"><title data-node-label="">用相同的檢查順序閱讀 for 與 while；核對邊界，再確認狀態朝結束前進。</title><desc data-node-explanation=""></desc><desc data-node-quote="">迴圈說穿了只有三件事：從哪裡開始、什麼時候繼續、每一輪怎麼變。</desc><rect x="770" y="2296.0" width="300" height="118" rx="10" fill="#fffdf7" stroke="#c69373"/><text x="790" y="2326.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">用相同的檢查順序閱讀 for 與 </text><text x="790" y="2352.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">while；核對邊界，再確認狀</text><text x="790" y="2378.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">態朝結束前進。</text></g><g data-node-id="detail_16" data-node-kind="meaning"><title data-node-label="">開始、繼續條件與更新共同決定重複執行。</title><desc data-node-explanation=""></desc><desc data-node-quote="">迴圈說穿了只有三件事：從哪裡開始、什麼時候繼續、每一輪怎麼變。</desc><rect x="770" y="2454.0" width="300" height="92" rx="10" fill="#fffdf7" stroke="#c69373"/><text x="790" y="2484.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">開始、繼續條件與更新共同決</text><text x="790" y="2510.0" fill="#302a25" font-family="Noto Sans CJK TC,sans-serif" font-size="20">定重複執行。</text></g></svg>