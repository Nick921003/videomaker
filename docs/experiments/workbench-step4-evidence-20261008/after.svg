<svg xmlns="http://www.w3.org/2000/svg" width="720" height="408" viewBox="0 0 720 408" role="img" aria-labelledby="mindmap-title" aria-describedby="source-evidence"><title id="mindmap-title">理解迴圈</title><desc id="source-evidence">教材原文引用：
概念 迴圈：迴圈會重複執行
概念 條件：條件控制是否繼續
概念 更新變數：更新變數可以避免無限迴圈
關係 loop → condition（由此控制）：條件控制是否繼續
關係 loop → update（需要搭配）：更新變數可以避免無限迴圈
完整教材：
迴圈會重複執行。條件控制是否繼續。更新變數可以避免無限迴圈。</desc><rect width="100%" height="100%" fill="#fffaf2"/><path d="M310,152.0 C360,152.0 360,80 410,80" fill="none" stroke="#b97755" stroke-width="2"/><path d="M310,152.0 C360,152.0 360,224 410,224" fill="none" stroke="#b97755" stroke-width="2"/><g data-node-id="loop"><title data-node-label="">迴圈</title><desc data-node-explanation="">重複執行指令。</desc><desc data-node-quote="">迴圈會重複執行</desc><rect x="30" y="100.0" width="280" height="104" rx="12" fill="#f5e2cf" stroke="#c69373"/><text x="170" y="159.0" text-anchor="middle" fill="#302a25" font-family="sans-serif" font-size="20" font-weight="700">迴圈</text></g><g data-node-id="condition"><title data-node-label="">條件</title><desc data-node-explanation="">決定是否繼續。</desc><desc data-node-quote="">條件控制是否繼續</desc><rect x="410" y="28" width="280" height="104" rx="12" fill="#f5e2cf" stroke="#c69373"/><text x="550" y="52" text-anchor="middle" fill="#73422c" font-family="sans-serif" font-size="14">由此控制</text><text x="550" y="88.0" text-anchor="middle" fill="#302a25" font-family="sans-serif" font-size="20" font-weight="700">條件</text></g><g data-node-id="update"><title data-node-label="">更新變數</title><desc data-node-explanation="">避免無限迴圈。</desc><desc data-node-quote="">更新變數可以避免無限迴圈</desc><rect x="410" y="172" width="280" height="104" rx="12" fill="#f5e2cf" stroke="#c69373"/><text x="550" y="196" text-anchor="middle" fill="#73422c" font-family="sans-serif" font-size="14">需要搭配</text><text x="550" y="232.0" text-anchor="middle" fill="#302a25" font-family="sans-serif" font-size="20" font-weight="700">更新變數</text></g></svg>