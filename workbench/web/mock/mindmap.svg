<svg xmlns="http://www.w3.org/2000/svg" width="610" height="720" viewBox="0 0 610 720" role="img" aria-labelledby="mindmap-title" aria-describedby="source-evidence"><title id="mindmap-title">理解迴圈</title><desc id="source-evidence">教材原文引用：
概念 迴圈：迴圈讓程式依條件重複執行。
概念 每一圈的過程：for 迴圈每一圈依序檢查條件、執行本體、更新變數。
概念 多跑一次的原因：邊界條件決定迴圈執行幾次，&lt; 與 &lt;= 可能相差一次。
概念 while 和 for 的選擇：for 適合次數明確的重複，while 適合依條件持續執行。
概念 無限迴圈：條件一直成立且變數沒有更新時，迴圈可能停不下來。
概念 巢狀迴圈的次數：巢狀迴圈中，內圈對每一次外圈都會完整執行。
關係 loop → q1（每圈過程）：for 迴圈每一圈依序檢查條件、執行本體、更新變數。
關係 loop → q2（邊界判斷）：邊界條件決定迴圈執行幾次，&lt; 與 &lt;= 可能相差一次。
關係 loop → q3（形式選擇）：for 適合次數明確的重複，while 適合依條件持續執行。
關係 loop → q4（停止條件）：條件一直成立且變數沒有更新時，迴圈可能停不下來。
關係 loop → q5（次數計算）：巢狀迴圈中，內圈對每一次外圈都會完整執行。
完整教材：
# 迴圈 迴圈讓程式依條件重複執行。 for 迴圈每一圈依序檢查條件、執行本體、更新變數。 邊界條件決定迴圈執行幾次，&lt; 與 &lt;= 可能相差一次。 for 適合次數明確的重複，while 適合依條件持續執行。 條件一直成立且變數沒有更新時，迴圈可能停不下來。 巢狀迴圈中，內圈對每一次外圈都會完整執行。</desc><rect width="100%" height="100%" fill="#fffaf2"/><path d="M260,300.0 C310,300.0 300,60 350,60" fill="none" stroke="#b97755" stroke-width="2"/><path d="M260,300.0 C310,300.0 300,180 350,180" fill="none" stroke="#b97755" stroke-width="2"/><path d="M260,300.0 C310,300.0 300,300 350,300" fill="none" stroke="#b97755" stroke-width="2"/><path d="M260,300.0 C310,300.0 300,420 350,420" fill="none" stroke="#b97755" stroke-width="2"/><path d="M260,300.0 C310,300.0 300,540 350,540" fill="none" stroke="#b97755" stroke-width="2"/><g data-node-id="loop"><rect x="30" y="258.0" width="230" height="84" rx="12" fill="#f5e2cf" stroke="#c69373"/><text x="145" y="305.0" text-anchor="middle" fill="#302a25" font-family="sans-serif" font-size="16" font-weight="700">迴圈</text></g><g data-node-id="q1"><rect x="350" y="18" width="230" height="84" rx="12" fill="#f5e2cf" stroke="#c69373"/><text x="465" y="43" text-anchor="middle" fill="#73422c" font-family="sans-serif" font-size="12">每圈過程</text><text x="465" y="76.0" text-anchor="middle" fill="#302a25" font-family="sans-serif" font-size="16" font-weight="700">每一圈的過程</text></g><g data-node-id="q2"><rect x="350" y="138" width="230" height="84" rx="12" fill="#f5e2cf" stroke="#c69373"/><text x="465" y="163" text-anchor="middle" fill="#73422c" font-family="sans-serif" font-size="12">邊界判斷</text><text x="465" y="196.0" text-anchor="middle" fill="#302a25" font-family="sans-serif" font-size="16" font-weight="700">多跑一次的原因</text></g><g data-node-id="q3"><rect x="350" y="258" width="230" height="84" rx="12" fill="#f5e2cf" stroke="#c69373"/><text x="465" y="283" text-anchor="middle" fill="#73422c" font-family="sans-serif" font-size="12">形式選擇</text><text x="465" y="316.0" text-anchor="middle" fill="#302a25" font-family="sans-serif" font-size="16" font-weight="700">while 和 for 的選擇</text></g><g data-node-id="q4"><rect x="350" y="378" width="230" height="84" rx="12" fill="#f5e2cf" stroke="#c69373"/><text x="465" y="403" text-anchor="middle" fill="#73422c" font-family="sans-serif" font-size="12">停止條件</text><text x="465" y="436.0" text-anchor="middle" fill="#302a25" font-family="sans-serif" font-size="16" font-weight="700">無限迴圈</text></g><g data-node-id="q5"><rect x="350" y="498" width="230" height="84" rx="12" fill="#f5e2cf" stroke="#c69373"/><text x="465" y="523" text-anchor="middle" fill="#73422c" font-family="sans-serif" font-size="12">次數計算</text><text x="465" y="556.0" text-anchor="middle" fill="#302a25" font-family="sans-serif" font-size="16" font-weight="700">巢狀迴圈的次數</text></g></svg>