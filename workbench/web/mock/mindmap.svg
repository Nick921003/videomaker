<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" data-root-id="loop" role="img" aria-labelledby="mindmap-title" aria-describedby="source-evidence"><title id="mindmap-title">理解迴圈</title><desc id="source-evidence">教材原文引用：
概念 迴圈：迴圈讓程式依條件重複執行。
概念 每一圈的過程：for 迴圈每一圈依序檢查條件、執行本體、更新變數。
概念 多跑一次的原因：邊界條件決定迴圈執行幾次，&lt; 與 &lt;= 可能相差一次。
概念 while 和 for 的選擇：for 適合次數明確的重複，while 適合依條件持續執行。
概念 無限迴圈：條件一直成立且變數沒有更新時，迴圈可能停不下來。
概念 巢狀迴圈的次數：巢狀迴圈中，內圈對每一次外圈都會完整執行。
關係 loop → q1（每圈過程）：for 迴圈每一圈依序檢查條件、執行本體、更新變數。
關係 loop → q2（邊界判斷）：邊界條件決定迴圈執行幾次，&lt; 與 &lt;= 可能相差一次。
關係 loop → q3（形式選擇）：for 適合次數明確的重複，while 適合依條件持續執行。
關係 loop → q4（停止條件）：條件一直成立且變數沒有更新時，迴圈可能停不下來。
關係 loop → q5（次數計算）：巢狀迴圈中，內圈對每一次外圈都會完整執行。
完整教材：
# 迴圈 迴圈讓程式依條件重複執行。 for 迴圈每一圈依序檢查條件、執行本體、更新變數。 邊界條件決定迴圈執行幾次，&lt; 與 &lt;= 可能相差一次。 for 適合次數明確的重複，while 適合依條件持續執行。 條件一直成立且變數沒有更新時，迴圈可能停不下來。 巢狀迴圈中，內圈對每一次外圈都會完整執行。</desc><rect width="100%" height="100%" fill="#fffaf2"/><path data-from="loop" data-to="q1" data-relation="每圈過程" d="M310,368.0 C360,368.0 360,80 410,80" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="loop" data-to="q2" data-relation="邊界判斷" d="M310,368.0 C360,368.0 360,224 410,224" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="loop" data-to="q3" data-relation="形式選擇" d="M310,368.0 C360,368.0 360,368 410,368" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="loop" data-to="q4" data-relation="停止條件" d="M310,368.0 C360,368.0 360,512 410,512" fill="none" stroke="#b97755" stroke-width="2"/><path data-from="loop" data-to="q5" data-relation="次數計算" d="M310,368.0 C360,368.0 360,656 410,656" fill="none" stroke="#b97755" stroke-width="2"/><g data-node-id="loop"><title data-node-label="">迴圈</title><desc data-node-explanation="">依條件重複執行程式。</desc><desc data-node-quote="">迴圈讓程式依條件重複執行。</desc><rect x="30" y="316.0" width="280" height="104" rx="12" fill="#f5e2cf" stroke="#c69373"/><text x="170" y="375.0" text-anchor="middle" fill="#302a25" font-family="sans-serif" font-size="20" font-weight="700">迴圈</text></g><g data-node-id="q1"><title data-node-label="">每一圈的過程</title><desc data-node-explanation="">for 迴圈每一圈依序檢查條件、執行本體、更新變數。</desc><desc data-node-quote="">for 迴圈每一圈依序檢查條件、執行本體、更新變數。</desc><rect x="410" y="28" width="280" height="104" rx="12" fill="#f5e2cf" stroke="#c69373"/><text x="550" y="52" text-anchor="middle" fill="#73422c" font-family="sans-serif" font-size="14">每圈過程</text><text x="550" y="88.0" text-anchor="middle" fill="#302a25" font-family="sans-serif" font-size="20" font-weight="700">每一圈的過程</text></g><g data-node-id="q2"><title data-node-label="">多跑一次的原因</title><desc data-node-explanation="">邊界條件決定迴圈執行幾次，&lt; 與 &lt;= 可能相差一次。</desc><desc data-node-quote="">邊界條件決定迴圈執行幾次，&lt; 與 &lt;= 可能相差一次。</desc><rect x="410" y="172" width="280" height="104" rx="12" fill="#f5e2cf" stroke="#c69373"/><text x="550" y="196" text-anchor="middle" fill="#73422c" font-family="sans-serif" font-size="14">邊界判斷</text><text x="550" y="232.0" text-anchor="middle" fill="#302a25" font-family="sans-serif" font-size="20" font-weight="700">多跑一次的原因</text></g><g data-node-id="q3"><title data-node-label="">while 和 for 的選擇</title><desc data-node-explanation="">for 適合次數明確的重複，while 適合依條件持續執行。</desc><desc data-node-quote="">for 適合次數明確的重複，while 適合依條件持續執行。</desc><rect x="410" y="316" width="280" height="104" rx="12" fill="#f5e2cf" stroke="#c69373"/><text x="550" y="340" text-anchor="middle" fill="#73422c" font-family="sans-serif" font-size="14">形式選擇</text><text x="550" y="376.0" text-anchor="middle" fill="#302a25" font-family="sans-serif" font-size="20" font-weight="700">while 和 for 的選擇</text></g><g data-node-id="q4"><title data-node-label="">無限迴圈</title><desc data-node-explanation="">條件一直成立且變數沒有更新時，迴圈可能停不下來。</desc><desc data-node-quote="">條件一直成立且變數沒有更新時，迴圈可能停不下來。</desc><rect x="410" y="460" width="280" height="104" rx="12" fill="#f5e2cf" stroke="#c69373"/><text x="550" y="484" text-anchor="middle" fill="#73422c" font-family="sans-serif" font-size="14">停止條件</text><text x="550" y="520.0" text-anchor="middle" fill="#302a25" font-family="sans-serif" font-size="20" font-weight="700">無限迴圈</text></g><g data-node-id="q5"><title data-node-label="">巢狀迴圈的次數</title><desc data-node-explanation="">巢狀迴圈中，內圈對每一次外圈都會完整執行。</desc><desc data-node-quote="">巢狀迴圈中，內圈對每一次外圈都會完整執行。</desc><rect x="410" y="604" width="280" height="104" rx="12" fill="#f5e2cf" stroke="#c69373"/><text x="550" y="628" text-anchor="middle" fill="#73422c" font-family="sans-serif" font-size="14">次數計算</text><text x="550" y="664.0" text-anchor="middle" fill="#302a25" font-family="sans-serif" font-size="20" font-weight="700">巢狀迴圈的次數</text></g></svg>