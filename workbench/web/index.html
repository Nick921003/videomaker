<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light">
	<meta name="theme-color" content="#ECE6DA">
	<title>多元教材工作台</title>
	<link rel="icon" href="data:,">
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="chat.css">
</head>
<body>
	<a class="skip-link" id="skip-link" href="#main-viewport">跳到內容</a>
	<div class="app-layout" id="app-layout">
		<aside class="rail" aria-label="主導覽">
			<a class="rail-brand" href="#/overview" aria-label="多元教材工作台，回到總覽">
				<svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
					<rect x="7" y="8" width="23" height="28" rx="3" stroke="currentColor" stroke-width="1.5"></rect>
					<rect x="12" y="4" width="23" height="28" rx="3" fill="#FFFDF7" stroke="currentColor" stroke-width="1.5"></rect>
					<path d="M19 13h9M19 18h9M19 23h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
				</svg>
				<span class="brand-copy"><span class="brand-title">多元教材</span><span class="brand-subtitle">工作台</span></span>
			</a>
			<button class="rail-toggle" id="rail-toggle" type="button" aria-label="收合導覽" aria-expanded="true" aria-controls="rail-navigation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z M9 4v16 M15 9l-3 3 3 3"></path></svg><span id="rail-toggle-label">收合導覽</span></button>
			<p class="rail-caption">同一份教材，多種學法</p>
			<span class="badge badge-mock" id="brand-mock-badge" hidden>示範模式</span>
			<nav id="rail-navigation" class="rail-nav" aria-label="工作台頁面">
				<a href="#/overview" class="rail-nav-item" data-page="overview">
					<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z"></path></svg>
					<span class="rail-label">總覽</span>
				</a>
				<a href="#/chat" class="rail-nav-item" data-page="chat">
					<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
					<span class="rail-label">AI 對話</span>
					<span class="badge badge-sm" style="background:#8b5a2b;color:white;font-size:10px;padding:1px 5px;border-radius:10px;margin-left:auto">原型</span>
				</a>
				<a href="#/make/1" class="rail-nav-item" data-page="make">
					<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z M10 9l5 3-5 3z"></path></svg>
					<span class="rail-label">製作</span>
					<span class="rail-dot" id="rail-queue-dot" title="有工作正在製作或排隊" aria-hidden="true" hidden></span>
					<span class="sr-only" id="queue-status" aria-live="polite"></span>
				</a>
				<a href="#/pipelines" class="rail-nav-item" data-page="pipelines">
					<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h6v5H3z M15 3h6v5h-6z M9 16h6v5H9z M6 8v4h12V8 M12 12v4"></path></svg>
					<span class="rail-label">流程架構</span>
				</a>
				<a href="#/library" class="rail-nav-item" data-page="library">
					<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h4v15H4z M10 5h4v15h-4z M17 5l4 14-3 1-4-14z"></path></svg>
					<span class="rail-label">素材庫</span>
				</a>
				<a href="#/usage" class="rail-nav-item" data-page="usage">
					<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16 M6 16v-5 M12 16V4 M18 16V8"></path></svg>
					<span class="rail-label">用量</span>
				</a>
				<a href="#/roadmap" class="rail-nav-item" data-page="roadmap">
					<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5l6-2 6 2 6-2v16l-6 2-6-2-6 2z M9 3v16 M15 5v16"></path></svg>
					<span class="rail-label">路線圖</span>
				</a>
			</nav>
			<footer class="rail-footer">
				<p>從學生的問題開始。</p>
				<span>讓教材，多一種可能。</span>
			</footer>
		</aside>
		<main class="main-viewport" id="main-viewport" tabindex="-1">
			<div id="page-host" class="page-host"></div>
			<noscript><p>請開啟瀏覽器的 JavaScript，才能使用工作台。</p></noscript>
		</main>
	</div>
	<script type="module" src="js/app.mjs"></script>
</body>
</html>
